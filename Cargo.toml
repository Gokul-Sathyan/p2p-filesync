[package]
name = "p2p_test"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
diffy = "0.5.1"
futures = "0.3.33"
libp2p = { version = "0.56.0", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "mdns", "macros", "kad", "identify"] }
libp2p-stream = "0.4.0-alpha"
notify = "8.2.0"
similar = "3.1.2"
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = "0.3.23"
